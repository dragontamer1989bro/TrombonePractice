<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trombone Slide</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #222; color: white; overflow: hidden; touch-action: none; }
    #slide-area { width: 100%; height: 80vh; background: linear-gradient(#f1c40f, #e67e22); position: relative; }
    .position-marker { width: 100%; height: 14.28%; border-bottom: 2px solid rgba(0,0,0,0.2); box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: rgba(0,0,0,0.5); }
    #status { height: 20vh; display: flex; align-items: center; justify-content: center; font-size: 28px; background: #111; flex-direction: column; }
    #start-btn { padding: 15px 30px; font-size: 20px; background: #e74c3c; border: none; border-radius: 10px; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <div id="slide-area">
    <div class="position-marker">1st (F)</div>
    <div class="position-marker">2nd (E)</div>
    <div class="position-marker">3rd (Eb)</div>
    <div class="position-marker">4th (D)</div>
    <div class="position-marker">5th (Db)</div>
    <div class="position-marker">6th (C)</div>
    <div class="position-marker">7th (B)</div>
  </div>
  <div id="status">
    <button id="start-btn">Tap to Start</button>
    <div id="current-pos">Position: -</div>
  </div>

  <script>
    const slideArea = document.getElementById('slide-area');
    const posDisplay = document.getElementById('current-pos');
    const startBtn = document.getElementById('start-btn');
    let audioCtx, oscillator, gainNode;

    // Frequencies moving down chromatically from F4 (1st pos) to B3 (7th pos)
    const frequencies = [349.23, 329.63, 311.13, 293.66, 277.18, 261.63, 246.94];

    startBtn.addEventListener('click', () => {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      oscillator = audioCtx.createOscillator();
      gainNode = audioCtx.createGain();
      
      oscillator.type = 'sawtooth';
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      gainNode.gain.value = 0; 
      oscillator.start();
      
      startBtn.style.display = 'none';
    });

    function updatePosition(y) {
      if (!audioCtx) return;
      const rect = slideArea.getBoundingClientRect();
      let relativeY = Math.max(0, Math.min(y - rect.top, rect.height - 1));
      
      const positionIndex = Math.floor((relativeY / rect.height) * 7);
      
      posDisplay.innerText = `Position: ${positionIndex + 1}`;
      oscillator.frequency.setValueAtTime(frequencies[positionIndex], audioCtx.currentTime);
      gainNode.gain.setTargetAtTime(0.5, audioCtx.currentTime, 0.05);
    }

    function stopSound() {
      if (gainNode) gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
      posDisplay.innerText = `Position: -`;
    }

    slideArea.addEventListener('touchstart', (e) => { e.preventDefault(); updatePosition(e.touches[0].clientY); });
    slideArea.addEventListener('touchmove', (e) => { e.preventDefault(); updatePosition(e.touches[0].clientY); });
    slideArea.addEventListener('touchend', stopSound);
  </script>
</body>
</html>
