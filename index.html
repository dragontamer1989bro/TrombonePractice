<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pocket Trombone</title>
  <style>
    body { margin: 0; background: #121212; color: #fff; font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: none; }
    #header { text-align: center; padding: 15px; background: #1e1e1e; border-bottom: 2px solid #b7950b; }
    h1 { margin: 0; font-size: 22px; color: #f1c40f; }
    #trombone-track { flex: 1; position: relative; background: linear-gradient(135deg, #1a1a1a, #2c2c2c); border-left: 8px solid #b7950b; border-right: 8px solid #b7950b; margin: 20px; border-radius: 12px; overflow: hidden; }
    .position-row { height: 14.28%; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: bold; font-size: 18px; color: #888; transition: background 0.1s; }
    .position-row.active { background: rgba(241, 196, 15, 0.3); color: #f1c40f; font-size: 22px; }
    #controls { padding: 20px; text-align: center; background: #1e1e1e; }
    button { padding: 12px 24px; font-size: 18px; background: #f1c40f; border: none; border-radius: 8px; font-weight: bold; color: #121212; cursor: pointer; }
  </style>
</head>
<body>

  <div id="header">
    <h1>Trombone Practice</h1>
    <div id="note-display" style="font-size: 14px; color: #aaa; margin-top: 5px;">Slide phone or drag screen</div>
  </div>

  <div id="trombone-track">
    <div class="position-row" data-pos="1"><span>1st Position</span><span>F4</span></div>
    <div class="position-row" data-pos="2"><span>2nd Position</span><span>E4</span></div>
    <div class="position-row" data-pos="3"><span>3rd Position</span><span>E♭4</span></div>
    <div class="position-row" data-pos="4"><span>4th Position</span><span>D4</span></div>
    <div class="position-row" data-pos="5"><span>5th Position</span><span>D♭4</span></div>
    <div class="position-row" data-pos="6"><span>6th Position</span><span>C4</span></div>
    <div class="position-row" data-pos="7"><span>7th Position</span><span>B3</span></div>
  </div>

  <div id="controls">
    <button id="start-btn">Enable Audio & Sensors</button>
  </div>

  <script>
    const rows = document.querySelectorAll('.position-row');
    const startBtn = document.getElementById('start-btn');
    const noteDisplay = document.getElementById('note-display');
    let audioCtx, osc, gainNode;
    const frequencies = [349.23, 329.63, 311.13, 293.66, 277.18, 261.63, 246.94];
    let currentPos = 0;

    startBtn.addEventListener('click', async () => {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        await DeviceMotionEvent.requestPermission();
      }
      
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      osc = audioCtx.createOscillator();
      gainNode = audioCtx.createGain();
      
      osc.type = 'sawtooth';
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      gainNode.gain.value = 0;
      osc.start();

      startBtn.style.display = 'none';
      noteDisplay.innerText = "Ready! Move phone or slide finger.";

      window.addEventListener('devicemotion', (e) => {
        let tilt = e.accelerationIncludingGravity.y || 0;
        let pos = Math.floor(Math.abs(tilt) / 2);
        updatePosition(Math.max(0, Math.min(6, pos)));
      });
    });

    function updatePosition(index) {
      if (!audioCtx) return;
      if (currentPos === index && gainNode.gain.value > 0) return;
      currentPos = index;

      rows.forEach((r, i) => r.classList.toggle('active', i === index));
      osc.frequency.setValueAtTime(frequencies[index], audioCtx.currentTime);
      gainNode.gain.setTargetAtTime(0.4, audioCtx.currentTime, 0.05);
      noteDisplay.innerText = `Playing Position ${index + 1} (${rows[index].children[1].innerText})`;
    }

    function stopSound() {
      if (gainNode) gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
      rows.forEach(r => r.classList.remove('active'));
      noteDisplay.innerText = "Paused";
    }

    const track = document.getElementById('trombone-track');
    track.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = track.getBoundingClientRect();
      let y = e.touches[0].clientY - rect.top;
      let pos = Math.floor((y / rect.height) * 7);
      updatePosition(Math.max(0, Math.min(6, pos)));
    });
    track.addEventListener('touchend', stopSound);
  </script>
</body>
